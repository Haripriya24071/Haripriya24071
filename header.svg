<svg width="900" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0d0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#0d0d0d"/>
  <ellipse cx="200" cy="120" rx="180" ry="120" fill="url(#glow)"/>

  <!-- Flowing dashed curves like the reference -->
  <!-- Curve 1 - large outer loop -->
  <path d="M 80 160 C 120 60, 280 40, 340 100 C 400 160, 360 180, 300 160" 
        fill="none" stroke="#FF2D78" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="-200" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Curve 2 - medium loop -->
  <path d="M 60 140 C 100 80, 220 60, 260 120 C 300 170, 260 190, 200 170" 
        fill="none" stroke="#c026d3" stroke-width="1" stroke-dasharray="5,5" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- Curve 3 - inner small loop -->
  <path d="M 100 155 C 130 110, 200 100, 230 140 C 255 170, 220 185, 180 170" 
        fill="none" stroke="#FF2D78" stroke-width="0.8" stroke-dasharray="4,6" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-150" dur="3.5s" repeatCount="indefinite"/>
  </path>

  <!-- Curve 4 - bottom sweep -->
  <path d="M 50 170 C 120 190, 260 195, 320 170 C 370 150, 350 130, 300 140" 
        fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="6,4" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Curve 5 - top arc -->
  <path d="M 90 100 C 150 30, 290 20, 340 80" 
        fill="none" stroke="#FF2D78" stroke-width="0.9" stroke-dasharray="5,5" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4.5s" repeatCount="indefinite"/>
  </path>

  <!-- Arrow heads on curves -->
  <polygon points="340,95 330,88 332,100" fill="#FF2D78" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0;2,2;0,0" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="260,118 250,112 252,124" fill="#c026d3" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,1;0,0" dur="5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="320,168 310,162 312,174" fill="#7c3aed" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="0,0;1,-2;0,0" dur="6s" repeatCount="indefinite"/>
  </polygon>

  <!-- Floating dots -->
  <circle cx="150" cy="80" r="2" fill="#FF2D78" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="145" r="1.5" fill="#c026d3" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="130" r="2" fill="#FF2D78" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="290" cy="160" r="1.5" fill="#7c3aed" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Name text -->
  <text x="420" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="-1">R Hari Priya</text>

  <!-- Pink underline accent -->
  <rect x="420" y="90" width="380" height="3" rx="2" fill="#FF2D78">
    <animate attributeName="width" values="0;380" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Subtitle lines -->
  <text x="422" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#FF2D78" letter-spacing="2" font-weight="600">AI ENGINEER  ·  BUILDER  ·  BANGALORE</text>
  <text x="422" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#888" letter-spacing="1">2nd Year CSE (AI)  ·  Jain University</text>
  <text x="422" y="173" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#666" letter-spacing="1">Hackathon Finalist ×3  ·  Open to Internships 🚀</text>

</svg>
